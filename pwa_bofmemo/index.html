<html lang="ja">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Back of Flyer Memo</title>
        <link rel="stylesheet" href="./style.css" />
        <link rel="manifest" href="./manifest.json" />
        <link
            href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
            rel="stylesheet"
        />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black" />
        <meta name="apple-mobile-web-app-title" content="Back of Flyer Memo" />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/icon?family=Material+Icons"
        />
    </head>
    <body>
        <header>
            <h1>Back of Flyer Memo</h1>
            <div class="header-actions">
                <button
                    id="send-button"
                    class="header-button"
                    title="ExpenditureBookへ直接送信"
                >
                    <span class="material-icons">send</span>
                </button>
                <button
                    id="export-button"
                    class="header-button"
                    title="クリップボードにコピー"
                >
                    <span class="material-icons">content_copy</span>
                </button>
                <button
                    id="settings-button"
                    class="header-button"
                    title="連携・ペアリング設定"
                >
                    <span class="material-icons">settings</span>
                </button>
            </div>
        </header>

        <main>
            <ul id="memo-list"></ul>
        </main>

        <button class="fab" id="action-button">
            <span class="material-icons">add</span>
        </button>

        <div id="memo-popup" class="popup-overlay">
            <div class="popup-content">
                <form id="memo-form">
                    <label for="memo-title">タイトル:</label>
                    <input type="text" id="memo-title" required />

                    <label>カテゴリ:</label>
                    <div id="memo-category-radio" class="category-radio-group">
                        <input
                            type="radio"
                            id="category-0"
                            name="memo-category"
                            value="0"
                            checked
                        />
                        <label for="category-0" class="category-label"
                            ><span class="material-icons">payments</span></label
                        >

                        <input
                            type="radio"
                            id="category-1"
                            name="memo-category"
                            value="1"
                        />
                        <label for="category-1" class="category-label"
                            ><span class="material-icons">numbers</span></label
                        >

                        <input
                            type="radio"
                            id="category-2"
                            name="memo-category"
                            value="2"
                        />
                        <label for="category-2" class="category-label"
                            ><span class="material-icons">phone</span></label
                        >

                        <input
                            type="radio"
                            id="category-3"
                            name="memo-category"
                            value="3"
                        />
                        <label for="category-3" class="category-label"
                            ><span class="material-icons">category</span></label
                        >
                    </div>

                    <label for="memo-body">本文:</label>
                    <textarea id="memo-body" inputmode="decimal"></textarea>

                    <label for="memo-timestamp">登録日時:</label>
                    <input type="datetime-local" id="memo-timestamp" />

                    <div class="form-actions">
                        <button type="submit">保存</button>
                        <button type="button" id="cancel-memo">
                            キャンセル
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <div id="settings-popup" class="popup-overlay">
            <div class="popup-content">
                <h2>連携設定 (ExpenditureBook)</h2>
                <p class="settings-desc">
                    PCのExpenditureBook画面に表示されたQRコードをスキャン、またはURLを設定してください。
                </p>
                <form id="settings-form">
                    <label for="server-url-input">接続先サーバーURL:</label>
                    <input
                        type="url"
                        id="server-url-input"
                        placeholder="http://expenditure.local:3000"
                        required
                    />
                    <div class="settings-helper-buttons">
                        <button type="button" id="paste-url-btn" class="secondary-button">
                            <span class="material-icons">content_paste</span> 貼付
                        </button>
                        <button type="button" id="scan-qr-btn" class="secondary-button">
                            <span class="material-icons">qr_code_scanner</span> QRスキャン
                        </button>
                        <button type="button" id="test-connection-btn" class="secondary-button">
                            <span class="material-icons">network_check</span> 接続テスト
                        </button>
                    </div>


                    <div id="qr-reader-container" class="qr-reader-container hidden">
                        <video id="qr-video" playsinline></video>
                        <button type="button" id="stop-qr-btn" class="danger-button">
                            スキャン停止
                        </button>
                    </div>

                    <div class="form-actions">
                        <button type="submit">設定を保存</button>
                        <button type="button" id="cancel-settings">
                            閉じる
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <div id="toast" class="toast"></div>

        <script src="./db.js" defer></script>

        <script src="./app.js" defer></script>
    </body>
</html>
